name: Render Jakarta What If
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg
      - name: Show Blender version
        run: blender --version
      - name: Render video
        run: blender -b -t 4 -P main.py
      - name: Upload rendered MP4 and Blender scene
        uses: actions/upload-artifact@v4
        with:
          name: jakarta-whatif-video
          path: |
            output/jakarta_whatif.mp4
            jakarta_whatif.blend
          if-no-files-found: error
